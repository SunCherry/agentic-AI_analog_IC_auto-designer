# ============================================================================
# Step 2b -- FUNCTION (schematic-agent, authored on top of the SHAPE above).
# 2a says XMN4/XMN3/XMN5 are a mirror; this section says which of them is the
# tail and which is the output load, and what each one moves in the spec.
# ============================================================================
function_analysis:
  summary: >-
    This is a two-stage Miller-compensated OTA: an NMOS input differential pair
    (XMN1/XMN2) with a 1:1 PMOS mirror load (XMP1/XMP2) converting differential
    to single-ended at net5, driving a PMOS common-source second stage (XMP3)
    loaded by an NMOS current source (XMN5) at vout. Stability comes from a
    Miller branch, XC0 (~4.05 pF MiM) in series with the nulling resistor R0
    (~100 ohm), tied from net5 back to vout -- pole splitting plus an R that
    pushes the gm2/Cc right-half-plane zero out of the way. Bias is entirely
    internal and has no external Ibias: the diode stack XMP4 over XMN4 sets a
    reference on net7, which the nfet mirror scales by integer m into the
    input pair's tail (XMN3) and the stage-2 load (XMN5). Every current in the
    circuit therefore traces back to one 2.3 um pfet, which makes MP4_W and the
    shared MN4_W the coarsest levers in the design and the direct carriers of
    the Power key. The signal path is Vip/Vin -> XMN1/XMN2 -> net4/net5 ->
    XMP3 -> vout, two gain stages in cascade with local Miller feedback around
    the second.
  blocks:
  - ref: XMN1, XMN2   (differential_pair, tg2)
    function: stage-1 input pair -- converts the differential input to a
      current difference; its gm1 is stage-1 gain and, with Cc, sets UGBW
    spec_keys: [Gain, UGBW, PM, Power]
  - ref: XMP1, XMP2   (current_mirror, pfet_load, tg3)
    function: stage-1 active load and differential-to-single-ended converter;
      its ro sets stage-1 output resistance, hence half the total gain
    spec_keys: [Gain, PM]
  - ref: XMN3         (current_mirror leg, tg1)
    function: input-pair tail current source -- sets the pair's bias current
      and therefore gm1; its m alone is the tail-current ratio knob
    spec_keys: [UGBW, Gain, Power]
  - ref: XMN4         (current_mirror reference, tg1; also self_biased_reference)
    function: the bias reference the whole nfet family mirrors from; shared
      unit w/l for all three legs, so it sets the family's current density
    spec_keys: [Power, UGBW, Gain]
  - ref: XMN5         (current_mirror leg, tg1)
    function: stage-2 current-source load -- sets XMP3's bias current and,
      through its ro, the second stage's output resistance
    spec_keys: [Gain, UGBW, PM, Power]
  - ref: XMP3         (common_source_stage)
    function: stage-2 gain device; its gm2 sets stage-2 gain, the RHP zero
      gm2/Cc that R0 cancels, and the output pole gm2/CL
    spec_keys: [Gain, PM, UGBW, Power]
  - ref: XMP4         (self_biased_reference)
    function: the pfet half of the self-biased diode stack; the smaller device,
      so it dominates the reference current for every mirror leg
    spec_keys: [Power, UGBW, Gain]
  - ref: XC0          (rc_compensation_network)
    function: Miller compensation capacitor -- splits the two poles and sets
      UGBW = gm1/(2*pi*Cc)
    spec_keys: [PM, UGBW]
  - ref: R0           (rc_compensation_network)
    function: series nulling resistor -- moves the RHP zero gm2/Cc toward or
      past infinity when R0 ~ 1/gm2; pure phase-margin device
    spec_keys: [PM]
  critical_techniques:
  - technique: Miller compensation with a series nulling resistor
    devices: [XC0, R0, XMP3, XMN1, XMN2]
    buys: >-
      Pole splitting -- the dominant pole moves to 1/(gm2*ro1*ro2*Cc) and the
      output pole out to gm2/CL -- plus removal of the RHP zero gm2/Cc that
      plain Miller capacitance creates, which is what makes >50 deg of phase
      margin reachable at all on a two-stage amp into 10 pF.
    costs: >-
      Cc directly divides UGBW (gm1/(2*pi*Cc)), so every degree of phase margin
      is bought with bandwidth; and R0 must track 1/gm2, so any change to
      XMP3's sizing silently detunes the zero.
  - technique: self-biased reference (no external Ibias)
    devices: [XMP4, XMN4]
    buys: >-
      A complete, self-contained amplifier -- no bias pin, no external current
      source, and a very small area cost (2.3 um of pfet setting a ~100 uA
      class of reference).
    costs: >-
      The reference is a plain diode stack, so it is supply- and
      temperature-dependent with no PTAT or bandgap behind it: the Power
      number, and every gm that follows from it, is a nominal-corner number
      only. Recorded as open_questions Q2.
  - technique: mirror ratio expressed as integer m on one shared unit device
    devices: [XMN4, XMN3, XMN5, XMP1, XMP2]
    buys: >-
      The 1 : 0.4 : 1.4 nfet current family is set by copy COUNT off one
      identical unit transistor, so the ratio is set by geometry that matches
      by construction and can be drawn as one interdigitated device family.
    costs: >-
      The ratio is quantized -- only integers are reachable, so a leg cannot be
      trimmed finely without moving the shared unit w, which moves every leg at
      once. That coupling is a real constraint on the tuning loop.
  - technique: 1:1 pfet mirror load for differential-to-single-ended conversion
    devices: [XMP1, XMP2]
    buys: >-
      Full differential-to-single-ended conversion with no signal current lost,
      and stage-1 gain gm1*(ro_n||ro_p) from a two-device load.
    costs: >-
      The mirror's own pole at net4 is a mirror-pole doublet in the signal
      path, and the load's ro caps stage-1 gain -- there is no cascode here to
      lift it, which is the structural reason Gain is the hardest key.
  - technique: PDK-bin folding as pure re-expression
    devices: [XMN1, XMN2, XMN3, XMN4, XMN5, XMP3]
    buys: >-
      Devices that would otherwise match no sky130 model card (320, 345 um)
      reach the simulator as m parallel copies of a legal per-copy w, with
      total width, topology and nets identical.
    costs: >-
      m is then doing double duty -- part bin compliance, part mirror ratio --
      so a fold on a ratio carrier must move every member's m by one common
      factor, or the ratio is silently damaged.

# ============================================================================
# Step 2c -- PARASITIC EXPOSURE (schematic-agent). Ranked most-sensitive
# first. Evidence is STRUCTURE AND GEOMETRY ONLY -- no layout and no PEX
# numbers exist at this stage, so where the netlist alone cannot rank
# something, `why` says so rather than inventing a number.
# `severity: high` is also device-shaper's selection filter for its Nf sweep.
# ============================================================================
parasitic_sensitivity:
- ref: R0 + XC0 (rc_compensation_network), net8
  nodes: [net8, net5, vout]
  mechanism: >-
    The compensation branch's EFFECTIVE R and C both include routing. Series
    routing resistance on net5-net8-vout adds directly to R0's ~100 ohm --
    R0 is small enough that a few tens of ohms of wire is a double-digit
    percentage error -- and it is sized to cancel a zero at gm2/Cc, so the
    error lands straight on phase margin. Routing capacitance from net8 to any
    rail shunts the cap and reduces the effective Cc.
  spec_keys: [PM, UGBW]
  severity: high
  why: >-
    This is the only element in the circuit whose design value (~100 ohm) is
    the same order as ordinary interconnect resistance. Nothing else here has
    that property, which is why it ranks first despite being two passive
    devices.
- ref: XMP3, XMN5, XC0 @ vout (common_source_stage + rc_compensation_network)
  nodes: [vout]
  mechanism: >-
    vout is a high-impedance gain node, the far plate of Cc, and the node the
    output pole gm2/CL sits on. Added capacitance moves that pole down and eats
    phase margin; added resistance in the XMP3/XMN5 drain path is directly in
    series with the output. It also carries the full stage-2 current, so it
    wants width -- which adds the very capacitance that hurts it.
  spec_keys: [PM, UGBW, Gain]
  severity: high
  why: >-
    Structural: two large drains (XMP3 at 120 um total, XMN5 at ~330 um) plus
    a 45x45 um MiM plate all land here, so this node's junction and plate area
    is the largest of any signal node in the design before a single wire is
    drawn. The 10 pF CL dominates absolutely, but the PM budget is what the
    parasitic increment is measured against.
- ref: net5 (XMP2, XMN2 drains / XMP3 gate / R0 node 1)
  nodes: [net5]
  mechanism: >-
    The stage-1 output and stage-2 input -- the highest-impedance node in the
    circuit, since it is loaded only by ro_p||ro_n and XMP3's gate. Capacitance
    here is multiplied by the second stage's gain looking into Cc, so it moves
    the dominant pole and pole splitting together. It is also half of the mn2
    differential pair, so capacitance added here and NOT at net4 is a
    differential error on top of the PM cost.
  spec_keys: [PM, UGBW, Gain]
  severity: high
  why: >-
    Highest impedance in the design AND a differential twin AND one end of the
    compensation branch -- three separate reasons in one node. How much
    capacitance a real route adds cannot be ranked from the netlist; only that
    this node is where it costs the most.
- ref: net7 bias spine (XMN4, XMN3, XMN5 gates + XMP4)
  nodes: [net7]
  mechanism: >-
    A gate-only net carrying zero DC current, so its resistance is INVISIBLE to
    every simulation this flow runs, yet each mirror leg samples Vgs at its own
    tap. A daisy chain outward from XMN4 gives XMN5 (the farthest, largest leg)
    a different Vgs from the reference -- a systematic current error in the
    tail and the stage-2 load simultaneously.
  spec_keys: [Power, UGBW, Gain]
  severity: high
  why: >-
    The severity comes from invisibility, not magnitude: nothing in this
    pipeline will ever measure this error, so it can only be prevented by
    layout discipline (one low-R spine, symmetric taps). Four devices and
    ~570 um of total gate width hang off it, the widest fan-out here.
- ref: XMN1, XMN2 (differential_pair) gates Vip/Vin and drains net4/net5
  nodes: [Vip, Vin, net4, net5]
  mechanism: >-
    A matched pair whose ratio is broken by a MISMATCHED routing load, not by
    an absolute one: unequal series R or coupling C between the two gates, or
    between the two drains, is input-referred offset and a CMRR floor that
    identical devices cannot cancel.
  spec_keys: [Gain]
  severity: medium
  why: >-
    Structurally this is the textbook high-severity item, and the devices are
    the largest in the design (320 um each, 8 copies) so their routing is long.
    Ranked MEDIUM only because this run's target_spec.json names no offset,
    CMRR or noise key -- nothing measured here will detect it. If an offset or
    CMRR key is ever added, this moves to the top of the list.
- ref: XMP1, XMP2 (current_mirror pfet_load) @ net4
  nodes: [net4]
  mechanism: >-
    net4 is diode-connected, so it is a moderate-impedance node (~1/gm_p), but
    it is also the mirror's gate spine and the twin of net5. Asymmetric loading
    versus net5 unbalances the differential-to-single-ended conversion; the
    mirror pole at 1/(net4 R*C) is a doublet in the signal path.
  spec_keys: [Gain, PM]
  severity: medium
  why: >-
    1/gm_p at these widths is low enough that ordinary routing capacitance
    moves the mirror pole well above UGBW, so the absolute effect is small; the
    asymmetry against net5 is the part that matters and it is a matching, not a
    magnitude, question.
- ref: net3 tail node (XMN1/XMN2 sources, XMN3 drain)
  nodes: [net3]
  mechanism: >-
    Low-impedance (1/gm of the pair in parallel with the tail's ro), so
    capacitance here barely moves the differential response. Asymmetric ACCESS
    from the two halves splits the tail current before any device mismatch
    does; the node's own capacitance sets the CMRR zero.
  spec_keys: [Gain]
  severity: low
  why: >-
    Genuinely low for the four keys this spec names -- the differential
    half-circuit does not see this node's capacitance. It is listed so layout
    knows the constraint is symmetric ACCESS, not low capacitance.
- ref: XC0 bottom-plate parasitic to substrate
  nodes: [net8]
  mechanism: >-
    A 45x45 um MiM cap has a real plate-to-substrate capacitance on its lower
    plate. Whichever plate faces net8 shunts the compensation branch's internal
    node; whichever faces vout adds to an already-dominated 10 pF load.
  spec_keys: [PM]
  severity: low
  why: >-
    Low because MiM caps in this stack sit high in the metal and their bottom
    plate parasitic is a small fraction of 4.05 pF -- but the netlist alone
    cannot rank it, since orientation is a layout choice not yet made. If it
    matters, orient the low plate toward vout, where CL swamps it.
