patterns:
# Step 2 -- matched against pattern-table.md, from build_decomposition.py's
# printed scan (re-printed to a scratch path; the scan was NOT re-run over
# this file). Every device has exactly one `primary` owner -- see
# `device_ownership` for the single structural overlap (XMN4) that two
# registered patterns legitimately share. `device_params` are the AS-WRITTEN
# netlist values; the tie-group seed re-expresses two nfet legs (see
# tie_groups.tg1.ratio_seed and open_questions Q1).
- id: current_mirror
  block: two_stage_rz
  instance_paths: ['(top)']
  devices: [XMN4, XMN3, XMN5]
  reference: XMN4
  legs: [XMN3, XMN5]
  tie_group: tg1_current_mirror
  matched_by: >-
    detector signature: XMN4 diode-connected (g==d==net7); XMN3 and XMN5 share
    that gate net AND the source rail VSS, with distinct drains (net3, vout).
    One REF fanning out to 2 legs = one 1:N finding, not two mirrors.
  confidence: certain
  device_params:
    XMN4: {w: 47.2, l: 0.15, m: 5, nf: 1}      # total 236.0 um
    XMN3: {w: 34.2, l: 0.15, m: 3, nf: 1}      # total 102.6 um
    XMN5: {w: 43.125, l: 0.15, m: 8, nf: 1}    # total 345.0 um
  note: >-
    The legs do genuinely different jobs (bias reference / input-pair tail /
    stage-2 load) and are still ONE tie group -- pattern-table's own watch-out.
    One shared unit w/l plus a per-leg integer m IS the mirror; three
    independent widths on one gate net is not, and is what the 0907 run
    produced under the old contract.
- id: current_mirror
  block: two_stage_rz
  instance_paths: ['(top)']
  devices: [XMP1, XMP2]
  reference: XMP1
  legs: [XMP2]
  tie_group: tg3_current_mirror
  matched_by: >-
    detector signature: XMP1 diode-connected (g==d==net4); XMP2 shares that
    gate net and the source rail VDD, distinct drain net5. 1:1 (m=1 both).
  confidence: certain
  device_params:
    XMP1: {w: 14.4, l: 0.15, m: 1, nf: 1}
    XMP2: {w: 14.4, l: 0.15, m: 1, nf: 1}
- id: differential_pair
  block: two_stage_rz
  instance_paths: ['(top)']
  devices: [XMN1, XMN2]
  tie_group: tg2_differential_pair
  matched_by: >-
    detector signature: same-type nfets sharing source net3 (not a rail),
    distinct gates (Vin, Vip) driven from OUTSIDE the pair -- the
    cross_coupled_pair disambiguator -- and distinct drains (net4, net5).
  confidence: certain
  device_params:
    XMN1: {w: 40, l: 0.15, m: 8, nf: 1}        # total 320.0 um
    XMN2: {w: 40, l: 0.15, m: 8, nf: 1}        # total 320.0 um
- id: common_source_stage
  block: two_stage_rz
  instance_paths: ['(top)']
  devices: [XMP3]
  tie_group: none
  matched_by: >-
    manual Structure test on the detector's `unclassified`: signal on the gate
    (net5 is stage-1's output, not a bias net), source on the VDD rail, drain
    at the high-impedance output `vout` loaded by a current source (XMN5).
  confidence: certain
  device_params:
    XMP3: {w: 40, l: 0.15, m: 3, nf: 1}        # total 120.0 um
- id: self_biased_reference
  block: two_stage_rz
  instance_paths: ['(top)']
  devices: [XMP4, XMN4]
  primary: [XMP4]
  tie_group: none
  matched_by: >-
    manual Structure test: diode-connected pfet XMP4 (g==d==net7, s=VDD) in
    series with diode-connected nfet XMN4 (g==d==net7, s=VSS) between the
    rails, drains tied at net7; no external Ibias source exists anywhere in
    the netlist. net7 gates the whole nfet mirror family.
  confidence: certain
  device_params:
    XMP4: {w: 2.3, l: 0.15, m: 1, nf: 1}
    XMN4: {w: 47.2, l: 0.15, m: 5, nf: 1}      # shared with the nfet current_mirror
  note: >-
    Per pattern-table: the SMALLER device dominates. XMP4 is 2.3 um against
    XMN4's 236 um total, so this one tiny pfet sets the reference current for
    every downstream mirror leg -- and therefore the Power key.
- id: rc_compensation_network
  block: two_stage_rz
  instance_paths: ['(top)']
  devices: [R0, XC0]
  tie_group: none
  matched_by: >-
    manual Structure test (invisible to the detector -- both devices passive,
    parse_devices() returns MOS/BJT only): XC0 bridges net8..vout and R0
    bridges net5..net8, so the series R+C spans net5 (stage-1 output /
    stage-2 input, high-Z gain node) to vout (stage-2 output gain node) --
    two consecutive gain-stage outputs. Confirmed by the scan's
    `[net net8] R0, XC0 -> test rc_compensation_network` clique.
  confidence: certain
  device_params:
    R0:  {w: 2.0, l: 4.15}                     # sky130_fd_pr__res_generic_po, ~100 ohm
    XC0: {w: 45, l: 45}                        # sky130_fd_pr__cap_mim_m3_1, ~4.05 pF

unmatched_devices: []   # all 11 devices matched to a registered pattern

device_ownership:
# The "every device exactly once" reconciliation, 11/11. XMN4 is structurally
# a member of TWO registered patterns -- the nfet mirror's REFERENCE and the
# self-biased leg's nfet half. That is what a self-biased mirror IS, not a
# detection ambiguity. Primary ownership goes to the current_mirror, because
# that is the pattern whose TIE GROUP sizing acts on and whose template
# variable (MN4_W/MN4_L) writes the device.
  XMP1: current_mirror(pfet_load)
  XMP2: current_mirror(pfet_load)
  XMN1: differential_pair
  XMN2: differential_pair
  XMN3: current_mirror(nfet_bias)
  XMN4: current_mirror(nfet_bias)     # also self_biased_reference (secondary)
  XMN5: current_mirror(nfet_bias)
  XMP3: common_source_stage
  XMP4: self_biased_reference
  R0:   rc_compensation_network
  XC0:  rc_compensation_network

cross_pattern_dependencies:
# SKILL.md Step 3 says cross-pattern dependencies are still AUTHORED, but the
# derived `tie_groups` only contain the three AUTO patterns, so there is no
# rc_compensation_network group to append one to. Recorded here instead, at
# top level, so nothing in the machine-written sections is edited.
- id: xpd1_miller_branch
  between: [rc_compensation_network, common_source_stage, differential_pair]
  devices: [R0, XC0, XMP3, XMN1, XMN2]
  dependency: >-
    HARD. R0 must track 1/gm2 of XMP3 to cancel the RHP zero gm2/Cc; Cc
    (XC0 area x ~2 fF/um^2 ~ 4.05 pF at 45x45) trades against gm1 of the input
    pair, since UGBW ~ gm1/(2*pi*Cc). Moving gm1 (MN1_W/MN1_L/MN1_M) or gm2
    (MP3_W/MP3_L) without revisiting R0_L/C0_W/C0_L moves UGBW and PM together
    and looks inexplicable in the iteration log.
- id: xpd2_bias_propagation
  between: [self_biased_reference, current_mirror]
  devices: [XMP4, XMN4, XMN3, XMN5]
  dependency: >-
    HARD. There is no external Ibias: XMP4 in series with XMN4 sets the whole
    reference current, which MN3_M and MN5_M then scale into the tail current
    and the stage-2 load current. So MP4_W and MN4_W move the tail current,
    the output-branch current, Power, UGBW and Gain all at once -- they are
    the coarsest levers in the design, not local ones.
matched_nets:
# Step 4 -- the layout half of the tie groups, in pattern-table.md's own
# vocabulary. Authored from the scan's `[net-match: ...]` candidates plus a
# manual pass for the two passive patterns (which get no candidates).
# layout (placer/router) reads this; sizing does not.
- id: mn1_input_gates
  nets: [Vip, Vin]
  kind: differential
  pattern: differential_pair
  devices: [XMN2, XMN1]
  terminal: gate
  scan_said: differential
  why: >-
    Route as mirror images about the pair's axis -- same layer, length, via
    count and neighbours. 20um of extra met1 on one gate is series R and
    coupling C the other half never sees: input-referred offset and CMRR loss
    that no amount of device matching can cancel.
- id: mn2_pair_drains
  nets: [net4, net5]
  kind: differential
  pattern: differential_pair
  devices: [XMN1, XMN2]
  terminal: drain
  scan_said: differential
  carried_outward_to:
    pattern: current_mirror(pfet_load)
    devices: [XMP1, XMP2]
    terminal: drain
    scan_said: branch
    promoted_to: differential
    because: >-
      Step 4.1's 1:1 check: the pfet load legs are m=1 on both with one shared
      w (MP1_W writes both), so the two branch nets ARE twins. CHOSEN
      DELIBERATELY as differential, not left at branch. If sizing ever moves
      MP1_M and MP2_M apart, this entry must drop back to `branch`.
  why: >-
    These are the same two physical nets as the pfet mirror's leg drains, so
    the pairing must not stop at the diff pair's boundary. Asymmetric load on
    net4 vs net5 unbalances stage-1's differential-to-single-ended conversion:
    systematic offset and a CMRR floor.
- id: mn3_tail_node
  nets: [net3]
  kind: common
  pattern: differential_pair
  devices: [XMN1, XMN2, XMN3]
  terminal: source (pair) / drain (tail device)
  scan_said: common
  why: >-
    Both halves must reach the tail identically. Asymmetric access splits the
    tail current before any device mismatch does -- offset that common-centroid
    device placement cannot undo.
- id: mn4_nfet_bias_spine
  nets: [net7]
  kind: common
  pattern: current_mirror(nfet_bias) + self_biased_reference
  devices: [XMN4, XMN3, XMN5, XMP4]
  terminal: gate (all four) / drain (XMN4, XMP4)
  scan_said: common
  why: >-
    The net that bites: it carries no DC current, so its resistance is
    invisible to simulation, yet each leg samples Vgs where IT taps. One
    low-resistance spine with symmetric taps, never a daisy chain outward from
    XMN4. It is simultaneously the self-biased leg's shared bias node, so IR
    drop along it is a systematic current error in the tail AND the stage-2
    load at once -- i.e. in Power, UGBW and Gain together.
- id: mn5_nfet_bias_leg_drains
  nets: [net7, net3, vout]
  kind: branch
  pattern: current_mirror(nfet_bias)
  devices: [XMN4, XMN3, XMN5]
  terminal: drain
  scan_said: branch
  why: >-
    Explicitly branch, NOT twins -- Step 4.1's 1:1 check FAILS here. The family
    seeds at m = 5 / 2 / 7 off one shared unit w, a deliberately ratioed
    1 : 0.4 : 1.4 current family. Do not route these as mirror images. What
    layout must match instead is the PER-UNIT wiring: each of the m copies
    should see the same interconnect, so the ratio the m count expresses is
    the ratio the silicon delivers.
- id: mn6_pfet_load_gate
  nets: [net4]
  kind: common
  pattern: current_mirror(pfet_load)
  devices: [XMP1, XMP2]
  terminal: gate
  scan_said: common
  why: >-
    Shared gate spine of the 1:1 load mirror. net4 is ALSO one half of mn2 (it
    is XMP1's drain as well as its gate, being diode-connected), so it carries
    a differential constraint and a common one at the same time -- match it to
    net5 AND keep it low-resistance.
- id: mn7_stage1_output_node
  nets: [net5]
  kind: sensitive
  pattern: rc_compensation_network + common_source_stage
  devices: [XMP2, XMN2, XMP3, R0]
  terminal: drain (XMP2/XMN2) / gate (XMP3) / node 1 (R0)
  scan_said: not proposed -- `sensitive` is never auto-proposed (Step 4.3)
  why: >-
    High-impedance gain node and the near end of the Miller branch. Routing
    capacitance here lands directly on pole splitting and phase margin; it is
    also half of mn2, so capacitance added asymmetrically versus net4 is a
    differential error on top of the PM cost. Keep short, away from rails and
    away from vout's swing.
- id: mn8_output_node
  nets: [vout]
  kind: sensitive
  pattern: common_source_stage + rc_compensation_network
  devices: [XMP3, XMN5, XC0]
  terminal: drain (XMP3/XMN5) / plate 2 (XC0)
  scan_said: not proposed -- `sensitive` is never auto-proposed (Step 4.3)
  why: >-
    The second high-impedance gain node and the far end of the compensation
    branch. Capacitance here moves the output pole, hence PM and UGBW
    directly; it also carries the full output current, so it needs width for
    IR drop -- which fights keeping it small.
- id: mn9_miller_internal_node
  nets: [net8]
  kind: sensitive
  pattern: rc_compensation_network
  devices: [R0, XC0]
  terminal: node 2 (R0) / plate 1 (XC0)
  scan_said: not proposed -- manual pattern, no candidates at all
  why: >-
    The node between the nulling resistor and the cap. Routing resistance here
    adds in series with R0, moving the zero away from the gm2 it was sized to
    cancel; routing capacitance here shunts the cap. Keep the R-C branch
    physically adjacent and short.
- id: mn10_supply_rails
  nets: [VDD, VSS]
  kind: none
  pattern: (all)
  devices: [all]
  terminal: source / bulk
  scan_said: excluded -- rails are never twins
  why: >-
    Recorded explicitly so this reads as "looked at", not "missed". Rails carry
    no matching constraint; their constraint is IR drop and it belongs to the
    power grid, not to this section.
open_questions:
# UNCONFIRMED -- authored by schematic-agent without an interactive channel
# (AskUserQuestion does not reach the user from inside a subagent). Each
# carries the recommendation THIS RUN PROCEEDED ON. The user closes them.
- id: Q1
  about: tg1_current_mirror -- the seed re-expression moved two legs' bias
  question: >-
    Re-expressing the nfet bias family on one shared unit device (w = 47.2,
    m = 5 / 2 / 7) preserves XMN4's 236.0 um exactly but moves XMN3 from
    102.6 to 94.4 um (-8.0%) and XMN5 from 345.0 to 330.4 um (-4.2%), which
    drops seed UGBW from the golden netlist's 11.46 MHz to ~9.43 MHz. Is
    sizing free to re-establish the bias family from that seed using the
    shared MN4_W/MN4_L and the per-leg MN3_M/MN5_M/MN4_M, accepting whatever
    totals fall out -- or must the as-written 236 / 102.6 / 345 um totals be
    reproduced exactly?
  needs: user confirmation
  agent_recommendation: >-
    Re-establish freely from the seed. The as-written totals are not a spec --
    target_spec.json names PM, UGBW, Gain and Power and nothing else -- and
    reproducing 102.6 / 345 exactly would require per-leg independent widths,
    which is the very thing the 0907 run did and the thing that is not a
    mirror. The shared w plus integer m is both the correct electrical
    expression and the only one layout can draw as one device family. The
    -8.0% / -4.2% shift is a starting-point offset for iteration 1 to correct,
    not a loss. THIS RUN PROCEEDED ON IT, unconfirmed.
- id: Q2
  about: absence of an external bias current
  question: >-
    The design has no external Ibias -- the reference is the self-biased
    XMP4/XMN4 diode stack, which makes the whole bias, and therefore the Power
    key, supply- and temperature-dependent with no PTAT or bandgap behind it.
    Confirm this is intended, and that Power is to be judged at the nominal
    1.8 V / tt corner the supplied testbench sets, not across PVT.
  needs: user confirmation
  agent_recommendation: >-
    Judge Power at the testbench's nominal 1.8 V / tt point -- the only
    condition the supplied deck defines. Inventing another would be authoring
    an operating condition the spec never states, which is a STOP, not a
    workaround. Recorded as an explicit hand-off risk: whatever margin the run
    achieves against the 0.5813 mW ceiling is a nominal-corner margin and is
    not corner-proof. No PVT sweep is in this run's scope. THIS RUN PROCEEDED
    ON IT, unconfirmed. (The same question was raised and closed ON this
    recommendation for the identical user files in test_miller_ota_0907.)
- id: Q3
  about: XMN4 double membership
  question: >-
    XMN4 belongs structurally to both current_mirror(nfet_bias) (as its
    reference) and self_biased_reference (as its nfet half). Which pattern
    owns it for the "every device exactly once" reconciliation?
  needs: none   # resolved from structure -- no user input required
  resolution: >-
    RESOLVED from the netlist alone. This is what a self-biased mirror IS, not
    a detection ambiguity: both readings are correct simultaneously. Primary
    ownership is assigned to current_mirror(nfet_bias), because that is the
    pattern whose tie group sizing acts on and whose template variables
    (MN4_W / MN4_L) physically write the device line. self_biased_reference
    keeps XMP4 as its exclusively-owned device and lists XMN4 as a secondary
    member. See `device_ownership`.
- id: Q4
  about: MP3_M and MP4_M are templated but frozen
  question: >-
    XMP3 (the stage-2 gain device) carries m=3 and XMP4 m=1, both templated as
    MP3_M / MP4_M but marked `tunable_by: fold` -- the loop refuses them,
    correctly, since neither device is a ratio carrier. So stage-2 drive can
    only be moved through MP3_W, whose per-copy w is bounded by the PDK model
    bin. Is that the intended limit?
  needs: none   # resolved from the contract -- recorded so the limit is visible
  resolution: >-
    RESOLVED from pattern-table.md: `m` is a sizing variable only where a
    pattern names it `ratio_carrier`, and common_source_stage / 
    self_biased_reference name none. It is frozen by design, and the PDK-bin
    fold is the only thing that writes it. Recorded here because it is a real
    ceiling on the stage-2 lever, and worth knowing before reading a Gain or
    PM shortfall as a sizing failure.
